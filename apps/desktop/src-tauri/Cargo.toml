[package]
name = "bianfa-desktop"
version = "0.0.1"
description = "bianfa — Windows Sticky Notes replacement (Tauri shell)"
authors = ["bianfa"]
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "bianfa_desktop_lib"
crate-type = ["rlib"]

[features]
# `app` pulls in the Tauri shell. It is disabled for host unit tests on Linux
# (`cargo test --no-default-features`), where webkit2gtk is unavailable.
default = ["app"]
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-deep-link",
  "dep:keyring",
  "dep:reqwest",
  "dep:tokio",
  "dep:image",
  "dep:blurhash",
  "dep:ed25519-dalek",
  "dep:sys-locale",
  "dep:semver",
]
# Bundles OpenSSL into SQLCipher (release builds; enabled via tauri.conf.json `build.features`).
# Off by default so that `cargo check --target <cross>` works on hosts without nmake/perl.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
tauri-plugin-single-instance = { version = "2.4.4", optional = true }
tauri-plugin-global-shortcut = { version = "2.3.2", optional = true }
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-updater = { version = "2.11.0", optional = true }
tauri-plugin-notification = { version = "2.4.0", optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
tauri-plugin-opener = { version = "2.5.5", optional = true }
tauri-plugin-deep-link = { version = "2.4.10", optional = true }

rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher", "load_extension"] }
yrs = "0.27.4"
cfb = "0.14.0"
keyring = { version = "4.2.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
blurhash = { version = "0.2", optional = true }
ed25519-dalek = { version = "2", optional = true }
sys-locale = { version = "0.3", optional = true }
semver = { version = "1", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
base64 = "0.22"
sha2 = "0.10"
blake3 = "1.8.7"
hex = "0.4"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
url = "2"
log = "0.4"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
