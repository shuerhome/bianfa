# =============================================================================
# bianfa · Redis 8.10 配置 —— 纯 ephemeral（第 1 章裁定 C8）
# -----------------------------------------------------------------------------
# 来源：第 1 章 C8（队列 = pg-boss 跑在 Postgres 里，Redis 不再持有任何持久数据）、
#       第 5 章（Hocuspocus extension-redis 只做实例间 pub/sub 转发）、
#       第 10 章 9.4.3 / 第 8 章（限流计数：滑动窗口 + 三层令牌桶，都是带 TTL 的计数器）。
# 挂载：/usr/local/etc/redis/redis.conf；requirepass 由 compose 在启动时写入 /tmp/redis-secret.conf 并 --include，
#       不出现在本文件也不出现在命令行。
# 必须人工替换：无。
#
# 为什么这几项这么配（C8 的连带结论，与第 9 章 8.5 正文相反）：
#   第 9 章 8.5 写「allkeys-lru 是危险的默认值，必须 noeviction + appendonly yes」，前提是 BullMQ 把队列放在 Redis 里，
#   LRU 驱逐会静默丢任务。第 1 章 C8 把队列换成 pg-boss 后，Redis 里只剩两类数据：
#     1. Hocuspocus 房间广播 —— pub/sub 消息，根本不落 key；
#     2. 限流计数 —— 带 TTL 的 INCR 计数器，被驱逐的后果只是「某个用户这一分钟多放行了几次」。
#   所以：丢 key 无业务损失 → allkeys-lru（内存满了淘汰最久未用的计数器，比拒绝写入让 API 报 500 好得多）；
#   没有需要恢复的数据 → 关 AOF、关 RDB（否则每次重启还要 fsync/加载一堆无意义快照，还得挂 volume）。
#   Redis 一旦重启：房间广播自动重连，限流窗口从零开始 —— 都可接受。
# =============================================================================

# ---- 网络 ------------------------------------------------------------------------
# 容器内地址；容器无 ports 映射，只在 docker data 网段可达
bind 0.0.0.0
# 有 requirepass 时不影响远端连接，只是多一道保险
protected-mode yes
port 6379
tcp-backlog 511
# 不按空闲时间踢客户端：Hocuspocus 的订阅连接是长连接
timeout 0
tcp-keepalive 300

# ---- 内存与淘汰（C8 核心）-----------------------------------------------------------
maxmemory 256mb
# 见文件头：无持久数据 → 满了就淘汰，绝不 noeviction
maxmemory-policy allkeys-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ---- 持久化：全部关闭（C8）----------------------------------------------------------
# 无 AOF —— 没有需要重放的数据
appendonly no
# 无 RDB 快照 —— 也就不需要 /data volume
save ""
stop-writes-on-bgsave-error no
# 即便某个命令触发落盘，也只会写进容器 tmpfs
dir /tmp

# ---- 连接 -------------------------------------------------------------------------
# api×2 + sync-ws 的连接池，余量很大
maxclients 2000
# 只用 db 0；限流 key 与 pub/sub channel 用前缀区分即可
databases 1

# ---- 日志 -------------------------------------------------------------------------
loglevel notice
# stdout → docker json-file 50m×3
logfile ""

# ---- 其他 -------------------------------------------------------------------------
# 不用 keyspace 通知，省 CPU
notify-keyspace-events ""
# 密码：由 --include /tmp/redis-secret.conf 提供 requirepass（见 docker-compose.yml redis.command）
