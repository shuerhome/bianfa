# =============================================================================
# bianfa · PostgreSQL 18.6 生产配置（Hostinger KVM 2：8 GB RAM / 2 vCPU / NVMe）
# -----------------------------------------------------------------------------
# 来源：第 9 章 8.6（括号内 KVM 2 数值）、8.7（archive_command 走 pgBackRest）、
#       第 10 章 9.4.5（不对宿主机之外监听 —— 靠 pg_hba.conf 限网段 + 容器无 ports 映射）。
# 挂载方式：compose 以 `postgres -c config_file=/etc/postgresql/postgresql.conf` 启动；
#          data_directory 由官方镜像的 PGDATA 环境变量提供（PG18 镜像 = /var/lib/postgresql/18/docker）。
# 必须人工替换：无。升级到 KVM 4 (16 GB) 时按行内注释改四个内存值。
#
# GUC 名称已对照 REL_18_STABLE 的 postgresql.conf.sample 核实（2026-09-05）：io_method / io_workers 为 18 新增，
# log_connections 在 18 改为字串列表语法。
# =============================================================================

# ---- 连接 -----------------------------------------------------------------------
# '*' 只在 docker data 网段可达：容器没有 ports 映射，pg_hba.conf 只放行 172.28.1.0/24 + 容器回环，其余 reject
listen_addresses = '*'
port = 5432
max_connections = 120                   # 前面有 PgBouncer；直连只有 sync-ws 的 LISTEN、exporter、pgbackrest、迁移
superuser_reserved_connections = 5
unix_socket_directories = '/var/run/postgresql'
password_encryption = scram-sha-256
ssl = off                               # 仅 docker 内网；TLS 在 Cloudflare 边缘与 Tunnel 内
hba_file = '/etc/postgresql/pg_hba.conf'
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ---- 内存（KVM 2 数值；KVM 4 见注释）-----------------------------------------------
shared_buffers = 2GB                    # KVM 4: 4GB
effective_cache_size = 5GB              # KVM 4: 11GB
maintenance_work_mem = 512MB            # KVM 4: 1GB
work_mem = 16MB                         # KVM 4: 24MB；×并发排序数，不要盲目加大
huge_pages = try
dynamic_shared_memory_type = posix      # 走 /dev/shm，compose 已 shm_size: 1gb
temp_file_limit = 5GB                   # 单会话临时文件上限，防一条烂查询吃满 100 GB 盘

# ---- IO（PG18 异步 IO）------------------------------------------------------------
# 不是 io_uring：moby 默认 seccomp 不放行 io_uring_setup/enter/register，容器内会启动失败（8.6 已核实）。
io_method = worker
io_workers = 4
effective_io_concurrency = 200          # NVMe
maintenance_io_concurrency = 200
random_page_cost = 1.1
default_toast_compression = lz4         # pgdg 构建带 lz4 / zstd

# ---- 并行（2 vCPU，保守）-----------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
jit = off                               # 短 OLTP 查询上 JIT 只增加延迟抖动

# ---- WAL / checkpoint --------------------------------------------------------------
wal_level = replica                     # pgBackRest 只需 replica
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_slot_wal_keep_size = 4GB            # 万一有人留了个复制槽，也不能把盘吃满
synchronous_commit = on

# ---- 归档 → pgBackRest → R2（8.7；RPO ≤ 60s）----------------------------------------
# archive_command 由 postgres 进程执行：pgbackrest 二进制、pgbackrest.conf 与 PGBACKREST_* 环境变量都在本容器内。
# 首次启动后必须先 `pgbackrest --stanza=bianfa stanza-create` 再 `check`（RUNBOOK D9），此前归档会失败重试
# （只是 WARNING，不影响写入；但 WAL 会在 pg_wal 里堆积，别拖太久）。
archive_mode = on
archive_command = 'pgbackrest --stanza=bianfa archive-push %p'
archive_timeout = 60s

# ---- autovacuum -------------------------------------------------------------------
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 800
autovacuum_naptime = 30s
log_autovacuum_min_duration = 1min

# ---- 超时 -------------------------------------------------------------------------
# statement_timeout 不设全局值（会误伤 pgbackrest / 迁移 / 大批量 GC），由 initdb 脚本设在应用角色上。
idle_in_transaction_session_timeout = 60s   # 保护 PgBouncer 池：挂起的事务 60s 后踢掉
idle_session_timeout = 0
lock_timeout = 0

# ---- 日志（stderr → docker json-file 50m×3 → Alloy 推到 Loki）------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500        # 慢查询阈值 ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_connections = ''                    # PG18 列表语法（receipt,authentication,…）；关掉：PgBouncer 重连噪音大，认证失败本来就是 FATAL 会记
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'UTC'

# ---- 统计与扩展 --------------------------------------------------------------------
# pg_bigm 必须 preload（官方文档），pg_stat_statements 用于 8.10「按指标升级」的 work_mem 溢出判断
shared_preload_libraries = 'pg_stat_statements,pg_bigm'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
track_activity_query_size = 4096
track_counts = on

# pg_bigm：默认值即可（enable_recheck=on、gin_key_limit=0、similarity_limit=0.3），列出便于日后调
pg_bigm.enable_recheck = on
pg_bigm.gin_key_limit = 0
pg_bigm.similarity_limit = 0.3

# ---- 其他 -------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.simple'   # 中文检索走 pg_bigm，不靠 tsearch 分词
