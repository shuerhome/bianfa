# =============================================================================
# bianfa · pgBackRest 配置 —— Cloudflare R2（S3 兼容）+ aes-256-cbc 客户端加密
# -----------------------------------------------------------------------------
# 来源：第 9 章 8.7（RPO ≤ 60s / RTO ≤ 40min、每周日全量、每日增量、retention-full=4、口令不写死、
#       每月 1 号 GitHub Actions 做 restore 演练）、第 1 章 S5、infra/cloudflare/r2.md §4/§6、infra/vps/backup.sh。
# 挂载到 postgres 容器 /etc/pgbackrest/pgbackrest.conf（pgBackRest 默认查找路径之一）。
# 所有选项名已对照 pgbackrest/pgbackrest main 分支 doc/xml/reference.xml（2026-09-05）。
#
# **本文件不含任何凭据。** 以下四项由 compose 注入为环境变量（规则：PGBACKREST_<OPTION>，大写、- 换 _；reference.xml 明文）：
#   PGBACKREST_REPO1_S3_ENDPOINT     = <R2_ACCOUNT_ID>.r2.cloudflarestorage.com（由 R2_ACCOUNT_ID 拼出）
#   PGBACKREST_REPO1_S3_KEY          = R2 token `bianfa-backups-rw` 的 Access Key ID
#   PGBACKREST_REPO1_S3_KEY_SECRET   = 其 Secret Access Key
#   PGBACKREST_REPO1_CIPHER_PASS     = 32 字节随机口令（openssl rand -hex 32）
# 「口令不存 VPS」的真实含义（backup.sh 头部有完整论证）：pgBackRest 是 repo 级对称加密，archive-push 每 ≤60s 在 VPS 上跑，
# 口令必然要在容器环境里；所以口令**不进 git、不写进任何 conf 文件**，只存在于 root:0600 的 .env.prod，权威副本在密码管理器 +
# GitHub Environment secret。丢了口令 = 全部备份作废，务必两处离线备份（与 minisign 私钥同等级）。
#
# R2 侧权限（r2.md §6 已核实）：R2 token 没有「只写」档；pgBackRest 需要读 backup.info、列目录、expire 删对象，
# 所以 `bianfa-backups-rw` 是 Object Read & Write 且只限该桶。**该桶不能开 bucket lock**（r2.md §4.2：lock 会让 expire /
# backup.info 覆写报错，备份链中断），不可变副本走 Phase 2 的 vault 桶。
#
# 必须人工替换：无（桶名如与实际不同，改 repo1-s3-bucket）。
#
# 触发（都不在本文件内）：宿主机 cron /etc/cron.d/bianfa → infra/vps/backup.sh {full|incr|check}
#   → `docker compose … exec -T -u postgres postgres pgbackrest --stanza=bianfa …`
# 首次部署一次性（RUNBOOK D9）：stanza-create → backup.sh check → backup.sh full
# =============================================================================

[global]
# ---- 仓库：R2 --------------------------------------------------------------------
repo1-type=s3
repo1-s3-bucket=bianfa-backups
repo1-s3-region=auto                      # R2 固定为 auto
repo1-s3-uri-style=path                   # R2 用 path 风格（endpoint/bucket/…），host 风格要额外 DNS
repo1-path=/pgbackrest                    # 桶内前缀
# repo1-s3-endpoint / repo1-s3-key / repo1-s3-key-secret → 环境变量，见文件头

# ---- 加密：R2 桶泄露 ≠ 数据泄露 ---------------------------------------------------
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass → 环境变量 PGBACKREST_REPO1_CIPHER_PASS

# ---- 保留 -----------------------------------------------------------------------
repo1-retention-full-type=count
repo1-retention-full=4                    # 4 个全量 = 每周日一次 → 约 1 个月 PITR 窗口
repo1-retention-archive-type=full
repo1-retention-archive=4

# ---- 布局：对象存储友好 ------------------------------------------------------------
repo1-bundle=y                            # 小文件打包，减少 R2 Class A 请求数
repo1-bundle-size=64MiB
repo1-block=y                             # 块级增量（依赖 repo1-bundle=y），delta restore 更快

# ---- 压缩 / 并行 -------------------------------------------------------------------
compress-type=zst
compress-level=3
process-max=2                             # KVM 2 只有 2 vCPU；备份在 03:00 UTC 低峰
start-fast=y                              # 立即 checkpoint 开始备份，不等 checkpoint_timeout
delta=y                                   # restore 时按校验和只拉差异文件（RTO ≤ 40 min 的关键）

# ---- WAL 异步归档 -------------------------------------------------------------------
archive-async=y
spool-path=/var/spool/pgbackrest          # compose named volume（镜像内已 chown postgres）
archive-push-queue-max=4GiB               # 队列超过 4 GiB（R2 长时间不可达）时**丢弃**队列并告诉 PG「已归档」：
                                          # PITR 链断裂需要新全量，但 100 GB 的盘不会被 WAL 撑爆把库带挂
                                          # （官方语义：Better to lose the backup than have PostgreSQL go down）。
                                          # 配合 backup.sh 的 pg_stat_archiver 检查 + 告警 #4 及时发现。
archive-get-queue-max=1GiB

# ---- 日志 / 锁 ---------------------------------------------------------------------
log-path=/var/log/pgbackrest              # 容器内 tmpfs
log-level-console=warn                    # archive_command 的 stdout 会进 postgres 日志：默认只报 warn+，
                                          # 人工/cron 操作由 backup.sh 用 --log-level-console=info 覆盖
log-level-file=detail
lock-path=/tmp/pgbackrest                 # 容器内 tmpfs

# ---- 网络 ------------------------------------------------------------------------
io-timeout=60
protocol-timeout=1830                     # 必须 > db-timeout
db-timeout=1800

[bianfa]
# PG18 官方镜像的 PGDATA（已核实：/var/lib/postgresql/<major>/docker，不再是 /var/lib/postgresql/data）
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql       # 经 unix socket + pg_hba 的 local peer 认证（OS 用户 postgres）
pg1-port=5432
pg1-user=postgres
