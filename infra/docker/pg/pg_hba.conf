# =============================================================================
# bianfa · pg_hba.conf —— 只允许 docker data 网段 + 容器回环，一律 scram-sha-256；其余全部 reject
# -----------------------------------------------------------------------------
# 来源：第 10 章 9.4.5（Postgres 不对外监听）、第 9 章 8.6。
# 挂载：postgresql.conf 里 hba_file = '/etc/postgresql/pg_hba.conf'（因此官方 entrypoint 追加到
#       $PGDATA/pg_hba.conf 的 `host all all all scram-sha-256` 那一行不会生效 —— 这正是我们要的）。
# 网段必须与 docker-compose.yml 的 networks.data.ipam.subnet 一致；改网段两处同改。
# 必须人工替换：无。
#
# 规则从上往下第一条匹配即生效。
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 容器内 unix socket：官方 entrypoint 初始化脚本、pgbackrest（archive-push / backup）、backup.sh 的 psql。
# peer = OS 用户名必须等于角色名 → compose 固定 POSTGRES_USER=postgres，容器以 uid 999 (postgres) 运行。
local   all             all                                     peer

# 容器自己的回环：compose healthcheck `pg_isready -h 127.0.0.1`（pg_isready 只发 startup 包，拿到认证请求就算活，
# 不会真的认证，也不会产生 FATAL 日志）。不放行的话每 10s 一条「pg_hba.conf rejects connection」噪音。
host    all             all             127.0.0.1/32            scram-sha-256

# docker data 网段（api / worker 经 pgbouncer、sync-ws 的 LISTEN 直连、alloy 的 exporter）
host    all             all             172.28.1.0/24           scram-sha-256

# 复制协议：本栈无副本，明确拒绝
host    replication     all             0.0.0.0/0               reject
host    replication     all             ::/0                    reject

# 其余一切（包括将来有人误加 ports: 映射或调整网络）全部拒绝
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
