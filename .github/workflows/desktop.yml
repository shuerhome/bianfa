# =============================================================================
# .github/workflows/desktop.yml —— 桌面端（Tauri 2.11.5）签名、公证、updater 签名、发布到 R2
#
# 来源章节
#   - 第 3 章 2.4.1（Windows：Azure Artifact Signing，signCommand 必须含 %1 否则静默不签名；工具 artifact-signing-cli，
#     已核实 tauri-docs distribute/Sign/windows.mdx 与 crates.io：0.11.0，trusted-signing-cli 已标 DEPRECATED）
#   - 第 3 章 2.4.2（macOS：Developer ID .p12 + App Store Connect API Key，不用 app-specific password；
#     tauri-macos-sign 的 Keychain::with_certificate 建临时 keychain 并在 Drop 时 delete-keychain，已核实源码）
#   - 第 3 章 2.4.3（tauri-plugin-updater 2.11.0 / minisign；私钥丢失不可恢复；latest.json 由 R2 + Worker 提供并做灰度）
#   - 第 3 章 2.4.4（Windows 主发 NSIS .exe per-user；macOS 发 .dmg + universal .app.tar.gz）
#   - 第 9 章 8.9（matrix windows-latest / macos-latest；aws s3 cp --endpoint-url 到 releases/{channel}/{version}/）
#   - 第 9 章 8.12（CI 门禁：产物内不得引用外部 CDN）
#   - 第 10 章 9.3.5 / 9.9 checklist #10（私钥仅在受保护 Environment；CI 断言产物不含私钥）、#11（Actions pin SHA）
#   - 第 1 章 S5 + infra/cloudflare/r2.md §6（R2 没有「只写」档：releases key 是 Object Read & Write、仅限该桶）
#   - infra/cloudflare/update-worker（MANIFEST_PREFIX=releases → releases/{channel}/latest.json；灰度 / kill switch 在 KV）
#
# 触发条件
#   - push tag `v*`（SemVer：v1.4.2 → stable；v1.5.0-beta.1 等带预发布后缀 → beta）
#   - workflow_dispatch：必须在 v* tag 的 ref 上手动运行（在 UI 里选择 tag），否则 meta 阶段直接失败
#   - 服务端镜像用 sha-* tag（backend.yml），不占用 v* 命名空间
#
# 需要的 Secrets（按名字）
#   Environment "release"（构建 + 签名）
#     TAURI_SIGNING_PRIVATE_KEY           updater 私钥：`tauri signer generate` 输出文件的内容（已核实 tauri-cli 源码：文件是 base64 编码的
#                                         minisign SecretKeyBox；给内容或路径都可）。全项目唯一不可恢复的单点
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  可为空字符串
#     AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID   Azure Artifact Signing 的 App Registration（artifact-signing-cli 读取）
#     APPLE_CERTIFICATE                   Developer ID Application 证书 .p12 的 base64
#     APPLE_CERTIFICATE_PASSWORD          .p12 密码
#     APPLE_SIGNING_IDENTITY              "Developer ID Application: <Name> (<TEAMID>)"，须与 .p12 一致
#     APPLE_API_KEY                       App Store Connect API Key ID
#     APPLE_API_ISSUER                    Issuer UUID
#     APPLE_API_KEY_P8                    AuthKey_<KEYID>.p8 的文件内容（本 workflow 写到临时文件并设 APPLE_API_KEY_PATH）
#   Environment "release-publish"（上传）
#     R2_RELEASES_ACCESS_KEY_ID / R2_RELEASES_SECRET_ACCESS_KEY   仅 bianfa-releases 桶的 R2 token（r2.md §6 行 1）
#     TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID                        可选
#
# 需要的 Repository variables
#   R2_ACCOUNT_ID          Cloudflare 账号 ID：<REPLACE_ME:cloudflare-account-id>
#   R2_RELEASES_BUCKET     默认 bianfa-releases（r2.md：location weur，无法域后缀 → 端点 <account>.r2.cloudflarestorage.com）
#   RELEASES_PUBLIC_HOST   公开下载主机名（R2 自定义域）：<REPLACE_ME:cdn.domain>
#
# Environment 保护规则建议
#   release
#     - Required reviewers：至少 1 人（开启 "Prevent self-review"）—— 任何人 push 一个 v* tag 都不能单独拿到签名密钥
#     - Deployment branches and tags：仅 tag 模式 `v*`
#     - 这里只放签名 / 公证类密钥
#   release-publish
#     - 不设 reviewers（避免同一次发布审批两次），只限 tag `v*`。r2.md 把 R2 releases key 写在 `release` 里，本文件把它拆到
#       `release-publish`：这把 key 最多能上传垃圾文件，客户端 minisign 验签会拒绝，不构成代码执行风险，不值得二次审批
#
# 其他模块的契约
#   - apps/desktop/src-tauri/tauri.conf.json：version（或 Cargo.toml [package].version）= tag 去掉 v；
#     bundle.createUpdaterArtifacts = true（v2 产物：NSIS 安装包 + .sig、.app.tar.gz + .sig；默认 false，不设就没有 .sig）；
#     bundle.windows.signCommand 含 %1；plugins.updater.pubkey 与 endpoints 已配置；frontendDist 指向 apps/desktop/dist
#   - 根 package.json "packageManager": "pnpm@11.25.0"；apps/desktop 有 `tauri` script（pnpm tauri）
#   - apps/desktop/src-tauri/rust-toolchain.toml 建议钉住 Rust 版本（本文件的 toolchain: stable 只保证能编译）
#   - Worker（/update）读 R2 `releases/{channel}/latest.json` 并按 installId 做灰度；**发版前先把 KV ROLLOUT_PERCENT 调低**
#     （r2.md §3.3「先写 KV 再传 latest.json」：KV 缺省视为 100，本 workflow 一上传就全量可见）
#
# 已知限制
#   - 只构建 Windows x64 与 macOS universal；Windows arm64 不在 v1 范围
#   - macOS runner 计费 10×：retryAttempts 保持 0，失败就人工看日志
# =============================================================================
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.20.0
  TAURI_DIR: apps/desktop/src-tauri

jobs:
  # ---------------------------------------------------------------------------
  # 解析版本 / 渠道，并在花任何 macOS 分钟之前把配置类错误挡掉
  # ---------------------------------------------------------------------------
  meta:
    name: version / channel / config gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 解析 tag → version / channel
        id: v
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::只能在 v* tag 上运行（当前 $REF）；workflow_dispatch 请在 UI 里选择 tag"; exit 1 ;;
          esac
          TAG="${REF#refs/tags/}"; VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag 不是 SemVer：$TAG"; exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then CHANNEL=beta; else CHANNEL=stable; fi
          {
            echo "tag=$TAG"; echo "version=$VERSION"; echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION channel=$CHANNEL"
      - name: 配置门禁（版本一致、createUpdaterArtifacts、signCommand 含 %1、updater 公钥与 endpoints 存在）
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          CONF="$TAURI_DIR/tauri.conf.json"
          test -f "$CONF" || { echo "::error::找不到 $CONF"; exit 1; }
          CONF_VERSION="$(jq -r '.version // empty' "$CONF")"
          if [ -z "$CONF_VERSION" ]; then
            CONF_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$TAURI_DIR/Cargo.toml" | head -1)"
          fi
          [ "$CONF_VERSION" = "$VERSION" ] || { echo "::error::应用版本 ($CONF_VERSION) 与 tag ($VERSION) 不一致"; exit 1; }
          # Tauri v2：不设 createUpdaterArtifacts=true 就没有 .sig / .app.tar.gz（默认 false；已核实 tauri-utils config.rs）
          jq -e '.bundle.createUpdaterArtifacts == true' "$CONF" >/dev/null \
            || { echo "::error::bundle.createUpdaterArtifacts 必须为 true（v1Compatible 会产出 .nsis.zip，与本 workflow 的收集规则不符）"; exit 1; }
          # 第 3 章 2.4.1：signCommand 缺 %1 会静默不签名；支持字符串与 {cmd,args} 两种写法（已核实 config.rs）
          jq -e '
            (.bundle.windows.signCommand // empty)
            | if type == "string" then test("%1")
              else ((.args // []) | join(" ") | test("%1")) end
          ' "$CONF" >/dev/null || { echo "::error::bundle.windows.signCommand 缺失或不含 %1"; exit 1; }
          jq -e '.plugins.updater.pubkey | strings | length > 0' "$CONF" >/dev/null \
            || { echo "::error::plugins.updater.pubkey 缺失（公钥必须编译进二进制）"; exit 1; }
          jq -e '.plugins.updater.endpoints | arrays | length > 0' "$CONF" >/dev/null \
            || { echo "::error::plugins.updater.endpoints 缺失"; exit 1; }
          echo "配置门禁通过"

  # ---------------------------------------------------------------------------
  # 构建 + 签名 + 公证 + updater 签名 + 本机断言（每个 OS 一个 job）
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    needs: [meta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # dtolnay/rust-toolchain 只有 master 与 stable/nightly/1.x 浮动 tag，没有 SemVer 发版；此 SHA = master HEAD @ 2026-09-05（已核实）
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.TAURI_DIR }}
          cache-on-failure: true

      - name: 安装依赖（--ignore-scripts）
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: "[Windows] 安装 artifact-signing-cli（第 3 章 2.4.1：官方文档给的工具；crates.io 0.11.0，2026-05-17）"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v artifact-signing-cli >/dev/null 2>&1; then
            cargo install artifact-signing-cli --version 0.11.0 --locked
          fi
          artifact-signing-cli --version || true

      - name: "[macOS] 写入 App Store Connect API Key（.p8）"
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8" || { echo "::error::缺少 secret APPLE_API_KEY_P8"; exit 1; }
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: 断言签名密钥已注入（缺任何一项都不要烧 macOS 分钟）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          need=(TAURI_SIGNING_PRIVATE_KEY)
          case "$RUNNER_OS" in
            Windows) need+=(AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID) ;;
            macOS)   need+=(APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER) ;;
          esac
          for v in "${need[@]}"; do [ -n "${!v:-}" ] || { echo "::error::Environment release 缺少 secret $v"; exit 1; }; done

      - name: tauri build（签名 / 公证 / updater 签名全部由 Tauri 按环境变量自动完成）
        # 不设 tagName / releaseId：只构建，不创建 GitHub Release；产物走 R2（第 3 章 2.4.3 带宽理由）
        # inputs 已对照 tauri-action v1.0.0 action.yml 核实：projectPath / tauriScript / args / uploadWorkflowArtifacts / uploadUpdaterJson / retryAttempts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
          retryAttempts: 0
        env:
          # updater（两端）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows：Azure Artifact Signing（endpoint / account / profile 在 tauri.conf.json 的 signCommand 里）
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          # macOS：Developer ID + notarytool（API Key 三件套；APPLE_API_KEY_PATH 由上一步写入 GITHUB_ENV）
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}

      - name: 收集产物到 out/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              B="$TAURI_DIR/target/release/bundle"
              cp "$B"/nsis/*-setup.exe "$B"/nsis/*-setup.exe.sig out/ ;;
            macOS)
              B="$TAURI_DIR/target/universal-apple-darwin/release/bundle"
              cp "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig "$B"/dmg/*.dmg out/ ;;
          esac
          ls -la out
          # 每个 updater 产物必须有非空 .sig（否则 TAURI_SIGNING_PRIVATE_KEY 没生效）
          for f in out/*-setup.exe out/*.app.tar.gz; do
            [ -e "$f" ] || continue
            test -s "$f.sig" || { echo "::error::缺少 updater 签名 $f.sig"; exit 1; }
          done

      - name: "[Windows] 断言 Authenticode 签名有效（安装包 + 主程序）"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targets = @(Get-ChildItem out\*.exe) + @(Get-ChildItem "$env:TAURI_DIR\target\release\*.exe")
          if ($targets.Count -eq 0) { Write-Host "::error::没有找到任何 .exe"; exit 1 }
          foreach ($f in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($f.Name) 签名状态 $($sig.Status) —— Azure Artifact Signing 未生效或 signCommand 有误"
              exit 1
            }
            Write-Host "签名 OK: $($f.Name) <- $($sig.SignerCertificate.Subject)"
          }

      - name: "[macOS] 断言 codesign / 公证装订 / universal 二进制"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$TAURI_DIR/target/universal-apple-darwin/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::找不到 .app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          BIN="$(find "$APP/Contents/MacOS" -type f | head -1)"
          ARCHS="$(lipo -archs "$BIN")"; echo "archs: $ARCHS"
          grep -q arm64 <<<"$ARCHS" && grep -q x86_64 <<<"$ARCHS" || { echo "::error::不是 universal 二进制"; exit 1; }

      - name: 门禁：产物不引用外部 CDN（第 9 章 8.12）
        shell: bash
        run: |
          set -euo pipefail
          DIST=apps/desktop/dist
          if [ ! -d "$DIST" ]; then echo "::warning::$DIST 不存在（frontendDist 改了？），CDN 门禁未执行"; exit 0; fi
          if grep -rEl 'https?://(fonts\.g|cdn\.jsdelivr|unpkg|cdnjs)' "$DIST"; then
            echo "::error::前端产物引用了外部 CDN，国内用户会白屏"; exit 1
          fi
          echo "CDN 门禁通过"

      - name: 门禁：产物中不含 updater 私钥（checklist #10；CVE-2023-46115 型 .env 泄漏）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          NEEDLES="$RUNNER_TEMP/needles.txt"
          # 1) minisign 私钥文件头  2) 第 10 章 9.3.5 原文要求的断言字符串
          # 3) 私钥本体：secret 是 base64 编码的整个 key 文件（已核实 tauri-cli updater_signature.rs），所以把 base64 原文和
          #    解码后的非注释行都作为 needle；只写入临时文件，绝不打印
          printf '%s\n' 'untrusted comment: rsign encrypted secret key' 'untrusted comment: minisign' > "$NEEDLES"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then KEY_CONTENT="$(cat "$TAURI_SIGNING_PRIVATE_KEY")"; else KEY_CONTENT="$TAURI_SIGNING_PRIVATE_KEY"; fi
            printf '%s\n' "$KEY_CONTENT" | grep -v '^untrusted comment' | grep -v '^[[:space:]]*$' >> "$NEEDLES" || true
            printf '%s' "$KEY_CONTENT" | tr -d '\r\n' | base64 -d 2>/dev/null \
              | grep -v '^untrusted comment' | grep -v '^[[:space:]]*$' >> "$NEEDLES" || true
          fi
          SCAN_DIRS=(out)
          [ -d apps/desktop/dist ] && SCAN_DIRS+=(apps/desktop/dist)
          RAW="$RUNNER_TEMP/rawbins.txt"; : > "$RAW"
          case "$RUNNER_OS" in
            Windows)
              find "$TAURI_DIR/target/release" -maxdepth 1 -type f -name '*.exe' > "$RAW" ;;
            macOS)
              find "$TAURI_DIR/target/universal-apple-darwin/release" -maxdepth 1 -type f -perm -u+x > "$RAW"
              # .app.tar.gz 是压缩包，必须解开再扫
              EXTRACT="$RUNNER_TEMP/app-extract"; mkdir -p "$EXTRACT"
              for t in out/*.app.tar.gz; do tar -xzf "$t" -C "$EXTRACT"; done
              SCAN_DIRS+=("$EXTRACT") ;;
          esac
          HITS=""
          for d in "${SCAN_DIRS[@]}"; do
            HITS+="$(grep -rlF -f "$NEEDLES" "$d" 2>/dev/null || true)"$'\n'
          done
          while IFS= read -r f; do
            [ -n "$f" ] && HITS+="$(grep -lF -f "$NEEDLES" "$f" 2>/dev/null || true)"$'\n'
          done < "$RAW"
          rm -f "$NEEDLES"
          HITS="$(printf '%s' "$HITS" | sed '/^$/d')"
          if [ -n "$HITS" ]; then
            echo "::error::以下产物中检测到 updater 私钥内容，发布终止："
            echo "$HITS"
            exit 1
          fi
          echo "OK：产物（原始二进制 / 前端 dist / 安装包 / .app）中不含 updater 私钥"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 汇总两端产物 → latest.json → R2 releases/{channel}/{version}/
  # ---------------------------------------------------------------------------
  publish:
    name: publish to R2 (${{ needs.meta.outputs.channel }}/${{ needs.meta.outputs.version }})
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: 二次断言：汇总产物中无私钥文件头（publish job 无私钥，只查固定字符串）
        run: |
          set -euo pipefail
          ls -la dist
          if grep -rlF -e 'untrusted comment: rsign encrypted secret key' -e 'untrusted comment: minisign' dist; then
            echo "::error::汇总产物含私钥特征字符串"; exit 1
          fi

      - name: 生成 SHA256SUMS.txt 与 latest.json
        env:
          RELEASES_PUBLIC_HOST: ${{ vars.RELEASES_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          test -n "$RELEASES_PUBLIC_HOST" || { echo "::error::缺少 vars.RELEASES_PUBLIC_HOST"; exit 1; }
          case "$RELEASES_PUBLIC_HOST" in *REPLACE_ME*) echo "::error::vars.RELEASES_PUBLIC_HOST 仍是占位符"; exit 1 ;; esac
          ( cd dist && sha256sum -- * > SHA256SUMS.txt )
          # 发布说明：annotated tag 的正文（lightweight tag 则为 commit message）
          NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | head -c 2000 || true)"
          export DOWNLOAD_BASE="https://${RELEASES_PUBLIC_HOST}/releases/${CHANNEL}/${VERSION}" RELEASE_NOTES="$NOTES"
          python3 - <<'PY'
          import datetime, json, os, pathlib, sys
          d = pathlib.Path("dist")
          version, base = os.environ["VERSION"], os.environ["DOWNLOAD_BASE"]

          def one(pattern):
              m = sorted(p for p in d.glob(pattern) if not p.name.endswith(".sig"))
              if len(m) != 1:
                  sys.exit(f"期望恰好 1 个 {pattern}，实际 {[p.name for p in m]}")
              sig = m[0].with_name(m[0].name + ".sig")
              if not sig.exists() or not sig.read_text().strip():
                  sys.exit(f"缺少或为空的签名 {sig.name}")
              return m[0].name, sig.read_text().strip()

          win, win_sig = one("*-setup.exe")      # Tauri v2：NSIS 安装包本身就是 updater 产物（已核实 updater_bundle.rs）
          mac, mac_sig = one("*.app.tar.gz")     # universal：同一文件同时服务 darwin-aarch64 / darwin-x86_64
          manifest = {
              "version": version,
              "notes": os.environ.get("RELEASE_NOTES", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {"signature": win_sig, "url": f"{base}/{win}"},
                  "darwin-aarch64": {"signature": mac_sig, "url": f"{base}/{mac}"},
                  "darwin-x86_64":  {"signature": mac_sig, "url": f"{base}/{mac}"},
              },
          }
          (d / "latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({k: v for k, v in manifest.items() if k != "notes"}, ensure_ascii=False, indent=2))
          PY

      - name: 上传到 R2（aws cli 2.x 预装于 ubuntu-24.04；只用 cp，不用 sync —— 不依赖 ListBucket）
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws cli ≥2.23 默认 CRC 校验与 R2 的兼容开关（官方建议；对支持的场景无害）
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASES_BUCKET || 'bianfa-releases' }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "::error::缺少 vars.R2_ACCOUNT_ID"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::缺少 R2_RELEASES_* secrets"; exit 1; }
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DEST="s3://${R2_BUCKET}/releases/${CHANNEL}/${VERSION}"
          aws s3 cp dist/ "${DEST}/" --recursive --exclude 'latest.json' \
            --endpoint-url "$EP" --no-progress --only-show-errors
          aws s3 cp dist/latest.json "${DEST}/latest.json" \
            --content-type application/json --cache-control 'public, max-age=60' \
            --endpoint-url "$EP" --no-progress --only-show-errors
          # 渠道级指针：Worker 读它做灰度；回滚在 Worker 的 KV 里做（KILL_SWITCH=1），不在这里覆盖
          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/releases/${CHANNEL}/latest.json" \
            --content-type application/json --cache-control 'no-cache' \
            --endpoint-url "$EP" --no-progress --only-show-errors
          echo "已上传到 ${DEST}/ 与 releases/${CHANNEL}/latest.json"

      - name: Job summary
        run: |
          {
            echo "## bianfa ${TAG} → ${CHANNEL}"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "latest.json 已写入 \`releases/${CHANNEL}/${VERSION}/\` 与 \`releases/${CHANNEL}/\`；灰度比例由 update-worker 的 KV ROLLOUT_PERCENT 控制（缺省 = 100，发版前先调低）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram 通知（未配置则跳过）
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "未配置 Telegram，跳过"; exit 0; fi
          printf -v MSG '[bianfa desktop] release %s (%s) publish %s\n%s' "$TAG" "$CHANNEL" "$STATUS" "$RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || echo "::warning::Telegram 发送失败"
