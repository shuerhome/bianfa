# =============================================================================
# .github/workflows/security.yml —— 供应链与镜像安全门禁
#
# 来源章节
#   - 第 10 章 9.3.6（Actions pin SHA；cargo-deny 四合一；npm/pnpm audit high 阻断；--ignore-scripts）
#   - 第 10 章 9.9 checklist #11（cargo deny check 阻断合并）、#12（gitleaks 全历史扫描通过）
#   - 第 9 章 8.5 / 第 10 章 9.4.5（镜像 non-root、只读根文件系统等由 compose 与 Dockerfile 保证；这里用 Trivy 扫已发布镜像与 IaC）
#   - backend.yml 已在 main 合并时对刚推送的 api / sync 镜像做 Trivy 阻断；本文件负责 PR 阶段的源码级扫描与每周对线上 :main 的复扫
#
# 触发条件
#   - pull_request / push main：gitleaks（全历史）、cargo-deny（桌面端 Rust 依赖）、pnpm audit（prod 依赖 HIGH+ 阻断）、
#     Trivy fs（pnpm-lock / Cargo.lock 的漏洞）+ Trivy config（infra/docker 的 Dockerfile / compose 误配）
#   - schedule 每周一 02:00 UTC / workflow_dispatch：Trivy 复扫 ghcr 上的 bianfa-api:main / bianfa-sync:main / bianfa-pg:main，
#     结果推 Telegram（新披露的 CVE 不会等你下次合并）
#   - 不用 pull_request_target；PR 阶段不接触任何 secrets（Telegram 只在 schedule / dispatch 的 job 里用）
#
# 需要的 Secrets
#   仓库级（自动）GITHUB_TOKEN：拉 ghcr 私有镜像（packages: read）
#   Environment "security-weekly"（仅 weekly job）：TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID（可选）
#
# 需要的 Repository variables
#   GHCR_NAMESPACE   与 backend.yml 相同：<REPLACE_ME:ghcr-namespace>
#
# 版本核实（2026-09-05）
#   - gitleaks v8.30.1 = 最新 tag；Docker Hub zricethezav/gitleaks:v8.30.1 索引 digest 见下（Docker Hub API）。用官方镜像而不是
#     gitleaks/gitleaks-action：后者对组织仓库要 GITLEAKS_LICENSE，镜像直跑没有这个依赖
#   - EmbarkStudios/cargo-deny-action v2.1.1（tag 指向 3c634983…，docker action；inputs 已对照 action.yml）
#   - aquasecurity/trivy-action v0.36.0（tag 指向 ed142fd0…）；Trivy v0.74.0 = 最新 release，也是该版 action 的默认值
#
# 其他模块的契约
#   - apps/desktop/src-tauri/deny.toml 存在（advisories / bans / sources / licenses 四段）；无 Cargo.toml 时 cargo-deny job 自动跳过
#   - 根 pnpm-lock.yaml 覆盖整个 workspace；pnpm audit 需要能访问 registry.npmjs.org 的 advisories 接口
#   - .gitleaks.toml（可选）放仓库根：allowlist 测试用假密钥等
# =============================================================================
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.20.0

jobs:
  # ---------------------------------------------------------------------------
  # gitleaks：全历史（fetch-depth 0），官方镜像按 digest pin
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (full history)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks git（全部提交；报告只在失败时作为 artifact 上传，日志里脱敏）
        run: |
          set -euo pipefail
          # 以 runner 用户身份运行：避免 git 的 "dubious ownership" 与报告文件属主问题；HOME 指向 /tmp 让 git 不抱怨
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1 \
              --report-format json --report-path /repo/gitleaks-report.json
      - name: 上传泄漏报告（仅失败时；报告含片段，保留期短）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # cargo-deny：advisories / bans / sources / licenses 四合一（第 10 章 9.3.6）
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo deny (desktop)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 有 Cargo.toml 才跑
        id: has
        run: |
          if [ -f apps/desktop/src-tauri/Cargo.toml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::apps/desktop/src-tauri/Cargo.toml 不存在，跳过 cargo-deny"; echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: steps.has.outputs.yes == 'true'
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check
          command-arguments: advisories bans sources licenses

  # ---------------------------------------------------------------------------
  # pnpm audit：prod 依赖 HIGH+ 阻断；全量（含 dev）只报告不阻断
  # ---------------------------------------------------------------------------
  pnpm-audit:
    name: pnpm audit
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: prod 依赖 HIGH/CRITICAL → 阻断
        run: pnpm audit --prod --audit-level high
      - name: 全量（含 dev）→ 只报告
        continue-on-error: true
        run: pnpm audit --audit-level high

  # ---------------------------------------------------------------------------
  # Trivy：源码级 —— lockfile 漏洞 + infra/docker 的 IaC 误配（root 用户、privileged、0.0.0.0 端口等）
  # ---------------------------------------------------------------------------
  trivy-source:
    name: trivy fs + config
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs（pnpm-lock.yaml / Cargo.lock；HIGH/CRITICAL 且有修复版本 → 阻断）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
      - name: Trivy config（Dockerfile / compose / Caddyfile 所在目录；HIGH/CRITICAL 阻断）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          version: v0.74.0
          skip-setup-trivy: "true"    # 上一步已安装同版本
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------------------
  # 每周：复扫线上 :main 三镜像（api / sync / pg），新 CVE 推 Telegram
  # ---------------------------------------------------------------------------
  weekly-images:
    name: weekly trivy on ghcr :main (${{ matrix.image }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: security-weekly
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [bianfa-api, bianfa-sync, bianfa-pg]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像是否已发布（还没上线的项目直接跳过而不是报错）
        id: exists
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/${{ matrix.image }}:main
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$IMAGE 不存在，跳过"; echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Trivy image（HIGH/CRITICAL 有修复版本 → 失败）
        id: scan
        if: steps.exists.outputs.yes == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ vars.GHCR_NAMESPACE }}/${{ matrix.image }}:main
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
      - name: Telegram（仅失败时；未配置则跳过）
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE: ${{ matrix.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "未配置 Telegram，跳过"; exit 0; fi
          printf -v MSG '[bianfa security] weekly trivy FAILED: %s:main has fixable HIGH/CRITICAL CVEs\n%s' "$IMAGE" "$RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || echo "::warning::Telegram 发送失败"
