# =============================================================================
# .github/workflows/restore-drill.yml —— 每月 1 号的备份恢复演练（第 9 章 8.7 强制项）
#
# 来源章节
#   - 第 9 章 8.7：pgBackRest → R2（aes-256-cbc）；每月 1 号在 runner 上的临时 Docker 执行：拉最新备份 → --delta restore
#     → 启库 → pg_amcheck --all + 三条业务校验 SQL → 结果推 Telegram。「没演练过的备份等于没有备份」
#   - 第 9 章 8.5：pgbackrest 在 postgres 镜像内 → 演练直接复用 backend.yml 推到 ghcr 的 bianfa-pg:main
#   - infra/RUNBOOK.md §5.2 / §5.3（environment `backup`、只读 token `bianfa-backups-ro`、cron 04:00 UTC 避开 03:00 的备份窗口）
#   - infra/cloudflare/r2.md §4（bianfa-backups 是法域 eu 桶 → 端点 <account>.eu.r2.cloudflarestorage.com）
#   - 第 1 章 S5：VPS 上的 backups key 是读写（pgBackRest 要读 info / expire 删对象，r2.md §6 已说明「只写」不可达）；
#     演练用另一把**只读** key，只存在于 GitHub Environment，VPS 上没有
#
# 触发条件
#   - schedule：每月 1 号 04:00 UTC（北京 12:00）。prod 的 incr/full 在 03:00 UTC 跑，别撞上
#   - workflow_dispatch：可指定 target_time（PITR 到时间点）与 backup_set（指定备份集）
#
# 需要的 Secrets（Environment "backup"）
#   R2_BACKUPS_RO_ACCESS_KEY_ID / R2_BACKUPS_RO_SECRET_ACCESS_KEY   token `bianfa-backups-ro`：仅 bianfa-backups 桶、Object Read only
#   PGBACKREST_REPO1_CIPHER_PASS      备份加密口令（与 prod 的 PGBACKREST_REPO1_CIPHER_PASS 相同；来源是密码管理器里的权威副本）
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#   GITHUB_TOKEN（自动）              拉 ghcr.io 上的 bianfa-pg:main
#
# 需要的 Repository variables
#   GHCR_NAMESPACE            与 backend.yml 相同：<REPLACE_ME:ghcr-namespace>
#   R2_ACCOUNT_ID             <REPLACE_ME:cloudflare-account-id>
#   R2_BACKUPS_BUCKET         默认 bianfa-backups
#   R2_BACKUPS_JURISDICTION   默认 eu（r2.md §2：备份桶带 -J eu）。置空 = 无法域桶，端点不带法域段
#   PGBACKREST_STANZA         默认 bianfa
#   PGBACKREST_REPO1_PATH     默认 /pgbackrest = prod infra/docker/pg/pgbackrest.conf 里显式写的值（pgBackRest 内建默认是 /var/lib/pgbackrest，不是 /）。
#                             **必须与 prod pgbackrest.conf 的 repo1-path 一致**，否则 info 报 stanza 不存在。
#                             注意 r2.md §4 写「repo1-path 默认 /」是错的；若 prod 显式写了 repo1-path=/，这里也设 /
#   DRILL_PG_SUPERUSER        默认 postgres（= prod 的 POSTGRES_USER；官方镜像只创建这一个超级用户）
#   DRILL_PG_DATABASE         默认 bianfa
#   DRILL_MAX_STALENESS_HOURS 默认 26：恢复出的库里最后一条 note_updates 距今超过此小时数 → 判定 WAL 归档链断裂
#
# Environment 保护规则建议
#   backup
#     - 不能设 Required reviewers：schedule 触发的 job 遇到审批会永远挂起，演练就静默不跑了
#     - Deployment branches：仅 main
#     - 这里的 key 只读、口令只解密备份；泄漏后果 = 备份被读取，因此该 Environment 的 secrets 访问日志要进审计
#
# 其他模块的契约
#   - infra/vps/restore-checks.sql（与 infra/vps/restore.sh 共用同一文件）：`psql -tA -F '|'` 下恰好输出一行
#     `users|notes|writes_24h|last_write_age_hours`（note_updates 为空时 last_write_age_hours = -1）
#   - prod 的 pgbackrest.conf：repo1-path / stanza / cipher-type 与本文件写出的临时配置一致
# =============================================================================
name: restore-drill

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      target_time:
        description: "可选：PITR 目标时间点，PostgreSQL timestamptz 字面量，例如 2026-09-04 12:00:00+00；留空 = 恢复到归档末尾"
        required: false
        default: ""
        type: string
      backup_set:
        description: "可选：pgBackRest 备份集标签（--set），留空 = 最新"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: restore latest backup on ephemeral runner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: backup
    env:
      STANZA: ${{ vars.PGBACKREST_STANZA || 'bianfa' }}
      PG_SU: ${{ vars.DRILL_PG_SUPERUSER || 'postgres' }}
      PG_DB: ${{ vars.DRILL_PG_DATABASE || 'bianfa' }}
      MAX_STALENESS_H: ${{ vars.DRILL_MAX_STALENESS_HOURS || '26' }}
      RTO_BUDGET_SEC: "2400"   # 第 9 章 8.7：RTO ≤ 40 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 取 pg 镜像（优先 ghcr 上与 prod 同一镜像；拉不到则从 infra/docker/pg 本地构建）
        id: img
        env:
          NS: ${{ vars.GHCR_NAMESPACE }}
          IMG: ghcr.io/${{ vars.GHCR_NAMESPACE }}/bianfa-pg:main
        run: |
          set -euo pipefail
          if [ -n "$NS" ] && docker pull -q "$IMG"; then
            echo "image=$IMG" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::拉取 $IMG 失败，改为本地构建 infra/docker/pg"
            docker build -t bianfa-pg:drill infra/docker/pg
            echo "image=bianfa-pg:drill" >> "$GITHUB_OUTPUT"
          fi

      - name: 写临时 pgbackrest.conf（不含密钥；S3 key 与 cipher 口令经环境变量注入容器）
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BACKUPS_BUCKET: ${{ vars.R2_BACKUPS_BUCKET || 'bianfa-backups' }}
          R2_JURISDICTION: ${{ vars.R2_BACKUPS_JURISDICTION || 'eu' }}
          REPO1_PATH: ${{ vars.PGBACKREST_REPO1_PATH || '/pgbackrest' }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "::error::缺少 vars.R2_ACCOUNT_ID"; exit 1; }
          case "$R2_ACCOUNT_ID" in *REPLACE_ME*) echo "::error::vars.R2_ACCOUNT_ID 仍是占位符"; exit 1 ;; esac
          # 法域桶的端点多一段（已核实 r2.md / Cloudflare 文档：<account>.eu.r2.cloudflarestorage.com）
          if [ -n "$R2_JURISDICTION" ]; then EP="${R2_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com"; else EP="${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"; fi
          cat > "$RUNNER_TEMP/pgbackrest.conf" <<EOF
          [global]
          repo1-type=s3
          repo1-s3-endpoint=${EP}
          repo1-s3-bucket=${R2_BACKUPS_BUCKET}
          repo1-s3-region=auto
          repo1-s3-uri-style=path
          repo1-path=${REPO1_PATH}
          repo1-cipher-type=aes-256-cbc
          log-level-console=info
          log-level-file=off
          process-max=2

          [${STANZA}]
          pg1-path=__PGDATA__
          EOF
          chmod 644 "$RUNNER_TEMP/pgbackrest.conf"
          echo "endpoint=${EP} bucket=${R2_BACKUPS_BUCKET} repo1-path=${REPO1_PATH} stanza=${STANZA}"

      - name: 起容器（覆盖 entrypoint，不跑 initdb；PGDATA 取镜像默认值 —— postgres:18 官方镜像已改为 /var/lib/postgresql/18/docker）
        id: ctr
        env:
          IMG: ${{ steps.img.outputs.image }}
          R2_KEY_ID: ${{ secrets.R2_BACKUPS_RO_ACCESS_KEY_ID }}
          R2_KEY_SECRET: ${{ secrets.R2_BACKUPS_RO_SECRET_ACCESS_KEY }}
          CIPHER_PASS: ${{ secrets.PGBACKREST_REPO1_CIPHER_PASS }}
        run: |
          set -euo pipefail
          test -n "$R2_KEY_ID" && test -n "$R2_KEY_SECRET" && test -n "$CIPHER_PASS" \
            || { echo "::error::Environment backup 缺少 R2_BACKUPS_RO_* 或 PGBACKREST_REPO1_CIPHER_PASS"; exit 1; }
          PGDATA="$(docker run --rm --entrypoint sh "$IMG" -c 'printf %s "$PGDATA"')"
          test -n "$PGDATA" || { echo "::error::镜像没有 PGDATA 环境变量"; exit 1; }
          sed -i "s#__PGDATA__#${PGDATA}#" "$RUNNER_TEMP/pgbackrest.conf"
          echo "pgdata=$PGDATA" >> "$GITHUB_OUTPUT"
          # pgBackRest 任何选项都可用 PGBACKREST_<OPTION> 环境变量传入（横线→下划线、大写）；密钥不落盘、不进 conf
          docker run -d --name pgdrill --shm-size 512m \
            -e PGBACKREST_REPO1_S3_KEY="$R2_KEY_ID" \
            -e PGBACKREST_REPO1_S3_KEY_SECRET="$R2_KEY_SECRET" \
            -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
            -v "$RUNNER_TEMP/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro" \
            --entrypoint sleep "$IMG" infinity
          docker exec pgdrill sh -c "mkdir -p '$PGDATA' /tmp/pgbackrest \
            && chown -R postgres:postgres '$PGDATA' /tmp/pgbackrest && chmod 700 '$PGDATA'"
          docker exec pgdrill pgbackrest version
          docker exec pgdrill sh -c 'command -v pg_amcheck >/dev/null || { echo "::error::镜像内没有 pg_amcheck（应随 postgresql-client-18 安装）"; exit 1; }'

      - name: pgbackrest info（能列出 stanza = endpoint / uri-style / key / cipher / repo1-path 全部正确）
        id: info
        run: |
          set -euo pipefail
          docker exec -u postgres pgdrill pgbackrest --stanza="$STANZA" info
          docker exec -u postgres pgdrill pgbackrest --stanza="$STANZA" --output=json info > "$RUNNER_TEMP/info.json"
          python3 - "$RUNNER_TEMP/info.json" "$STANZA" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys, datetime
          data = json.load(open(sys.argv[1]))
          st = next((s for s in data if s.get("name") == sys.argv[2]), None)
          if st is None:
              sys.exit(f"info 里没有 stanza {sys.argv[2]!r}（repo1-path / bucket / endpoint 错？）")
          code = st.get("status", {}).get("code", -1)
          if code != 0:
              sys.exit(f"stanza 状态异常：{st.get('status')}")
          backups = st.get("backup", [])
          if not backups:
              sys.exit("stanza 里没有任何备份")
          last = backups[-1]
          stop = datetime.datetime.fromtimestamp(last["timestamp"]["stop"], datetime.timezone.utc)
          arch = (st.get("archive") or [{}])[-1]
          print(f"label={last['label']}")
          print(f"type={last['type']}")
          print(f"stop={stop.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"archive_max={arch.get('max', '')}")
          print(f"backup_count={len(backups)}")
          PY

      - name: restore（--delta；--archive-mode=off 防止演练库把 WAL 推回 prod 的 repo —— 已核实 restore 选项 preserve|off）
        id: restore
        env:
          TARGET_TIME: ${{ inputs.target_time }}
          BACKUP_SET: ${{ inputs.backup_set }}
        run: |
          set -euo pipefail
          ARGS=(--stanza="$STANZA" --delta --archive-mode=off --log-level-console=info)
          [ -n "${BACKUP_SET:-}" ] && ARGS+=(--set="$BACKUP_SET")
          if [ -n "${TARGET_TIME:-}" ]; then
            ARGS+=(--type=time --target="$TARGET_TIME" --target-action=promote)
          fi
          t0=$(date +%s)
          docker exec -u postgres pgdrill pgbackrest "${ARGS[@]}" restore
          t1=$(date +%s)
          echo "seconds=$((t1 - t0))" >> "$GITHUB_OUTPUT"
          echo "restore 用时 $((t1 - t0)) s"

      - name: 启库并等待 WAL 回放完成（restore_command 由 pgbackrest 写入 postgresql.auto.conf，经 archive-get 从 R2 取 WAL）
        id: recover
        env:
          PGDATA: ${{ steps.ctr.outputs.pgdata }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          # prod 的 postgresql.conf 挂在容器外（compose command -c config_file=…），不在备份里；这里显式给出与 prod 一致的关键 GUC
          OPTS="-c listen_addresses=localhost -c port=5432 -c archive_mode=off -c shared_preload_libraries=pg_stat_statements,pg_bigm -c io_method=worker -c shared_buffers=512MB -c max_connections=20 -c hot_standby=on"
          docker exec -u postgres pgdrill pg_ctl -D "$PGDATA" -w -t 900 -l /tmp/pg.log start -o "$OPTS" \
            || { docker exec pgdrill tail -n 80 /tmp/pg.log; exit 1; }
          state=""
          for _ in $(seq 1 180); do   # 最多 30 分钟
            state="$(docker exec -u postgres pgdrill psql -X -U "$PG_SU" -d postgres -Atc 'select pg_is_in_recovery()' 2>/dev/null || echo err)"
            [ "$state" = "f" ] && break
            sleep 10
          done
          if [ "$state" != "f" ]; then
            echo "::error::30 分钟内未完成回放 / 未 promote（state=$state）"
            docker exec pgdrill tail -n 80 /tmp/pg.log
            exit 1
          fi
          t1=$(date +%s)
          echo "seconds=$((t1 - t0))" >> "$GITHUB_OUTPUT"
          docker exec -u postgres pgdrill psql -X -U "$PG_SU" -d postgres -Atc 'select version()'
          docker exec -u postgres pgdrill psql -X -U "$PG_SU" -d postgres -Atc 'select pg_last_wal_replay_lsn(), now()'

      - name: pg_amcheck --all（heap + btree 一致性；amcheck 扩展缺失则自动安装）
        id: amcheck
        continue-on-error: true
        run: docker exec -u postgres pgdrill pg_amcheck -U "$PG_SU" --all --install-missing --jobs 2 --progress

      - name: 三条业务校验 SQL（用户数 / 便笺数 / 最近 24h 写入量 + 最后写入距今）
        id: biz
        run: |
          set -euo pipefail
          SQL=infra/vps/restore-checks.sql
          test -f "$SQL" || { echo "::error::缺少 $SQL（与 restore.sh 共用；须输出一行 users|notes|writes_24h|last_write_age_hours）"; exit 1; }
          ROW="$(docker exec -i -u postgres pgdrill psql -X -U "$PG_SU" -d "$PG_DB" -v ON_ERROR_STOP=1 -At -F '|' < "$SQL" | tail -n 1)"
          echo "raw=$ROW"
          IFS='|' read -r USERS NOTES WRITES24 AGE_H <<< "$ROW"
          {
            echo "users=$USERS"; echo "notes=$NOTES"; echo "writes_24h=$WRITES24"; echo "last_write_age_hours=$AGE_H"
          } >> "$GITHUB_OUTPUT"
          FAIL=0
          [[ "${USERS:-}" =~ ^[0-9]+$ ]] && [ "$USERS" -gt 0 ] || { echo "::error::恢复出的库用户数为 0 或不可读（$USERS）"; FAIL=1; }
          [[ "${NOTES:-}" =~ ^[0-9]+$ ]] && [ "$NOTES" -gt 0 ] || { echo "::error::恢复出的库便笺数为 0 或不可读（$NOTES）"; FAIL=1; }
          # 归档链是否新鲜：最后一条 note_updates 距今（runner 时钟）不应超过阈值；-1 表示表为空；非数字 = SQL 契约不符
          if ! awk -v a="${AGE_H:-x}" -v m="$MAX_STALENESS_H" 'BEGIN { if (a !~ /^-?[0-9.]+$/) exit 2; exit (a >= 0 && a <= m) ? 0 : 1 }'; then
            echo "::error::最后写入距今 ${AGE_H:-?} h（阈值 ${MAX_STALENESS_H} h）—— WAL 归档链可能断裂、note_updates 为空，或 SQL 输出格式不对"; FAIL=1
          fi
          exit $FAIL

      - name: 汇总（RTO 预算对照；把 continue-on-error 的 amcheck 结果变成 job 结论）
        id: summary
        if: always()
        env:
          RESTORE_S: ${{ steps.restore.outputs.seconds }}
          RECOVER_S: ${{ steps.recover.outputs.seconds }}
          AMCHECK: ${{ steps.amcheck.outcome }}
          BIZ: ${{ steps.biz.outcome }}
          LABEL: ${{ steps.info.outputs.label }}
          BTYPE: ${{ steps.info.outputs.type }}
          BSTOP: ${{ steps.info.outputs.stop }}
          ARCHIVE_MAX: ${{ steps.info.outputs.archive_max }}
          USERS: ${{ steps.biz.outputs.users }}
          NOTES: ${{ steps.biz.outputs.notes }}
          WRITES24: ${{ steps.biz.outputs.writes_24h }}
          AGE_H: ${{ steps.biz.outputs.last_write_age_hours }}
        run: |
          TOTAL=$(( ${RESTORE_S:-0} + ${RECOVER_S:-0} ))
          RTO_NOTE="within budget"
          if [ "$TOTAL" -gt "$RTO_BUDGET_SEC" ]; then RTO_NOTE="OVER 40 min budget"; echo "::warning::恢复总用时 ${TOTAL}s 超过 RTO 预算 ${RTO_BUDGET_SEC}s"; fi
          {
            echo "## restore drill — $(date -u +%F)"
            echo
            echo "| 项 | 值 |"; echo "|---|---|"
            echo "| backup | ${LABEL:-?} (${BTYPE:-?}) stop ${BSTOP:-?} |"
            echo "| archive max | ${ARCHIVE_MAX:-?} |"
            echo "| restore / replay | ${RESTORE_S:-?}s / ${RECOVER_S:-?}s = ${TOTAL}s (${RTO_NOTE}) |"
            echo "| pg_amcheck | ${AMCHECK} |"
            echo "| business checks | ${BIZ} — users=${USERS:-?} notes=${NOTES:-?} writes_24h=${WRITES24:-?} last_write_age_h=${AGE_H:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total_seconds=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "rto_note=$RTO_NOTE" >> "$GITHUB_OUTPUT"
          [ "$AMCHECK" = "success" ] || { echo "::error::pg_amcheck 报告了损坏或未能运行（outcome=$AMCHECK）"; exit 1; }

      - name: 清理容器（连同匿名卷）
        if: always()
        run: docker rm -f -v pgdrill >/dev/null 2>&1 || true

      - name: Telegram 通知（第 9 章 8.7：结果推 Telegram）
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          LABEL: ${{ steps.info.outputs.label }}
          BSTOP: ${{ steps.info.outputs.stop }}
          TOTAL: ${{ steps.summary.outputs.total_seconds }}
          RTO_NOTE: ${{ steps.summary.outputs.rto_note }}
          AMCHECK: ${{ steps.amcheck.outcome }}
          BIZ: ${{ steps.biz.outcome }}
          USERS: ${{ steps.biz.outputs.users }}
          NOTES: ${{ steps.biz.outputs.notes }}
          WRITES24: ${{ steps.biz.outputs.writes_24h }}
          AGE_H: ${{ steps.biz.outputs.last_write_age_hours }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::未配置 Telegram —— 8.7 要求结果推 Telegram，请补 secrets"; exit 0
          fi
          printf -v MSG '[bianfa restore drill] %s\nbackup: %s (stop %s)\nrestore+replay: %ss (%s)\npg_amcheck: %s\nbusiness: %s users=%s notes=%s writes_24h=%s last_write_age_h=%s\n%s' \
            "$STATUS" "${LABEL:-?}" "${BSTOP:-?}" "${TOTAL:-?}" "${RTO_NOTE:-?}" "${AMCHECK:-?}" \
            "${BIZ:-?}" "${USERS:-?}" "${NOTES:-?}" "${WRITES24:-?}" "${AGE_H:-?}" "$RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || echo "::warning::Telegram 发送失败"
